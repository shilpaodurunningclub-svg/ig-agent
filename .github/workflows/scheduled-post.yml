name: Daily Instagram Post

on:
  schedule:
    # 13:30 UTC = 19:00 (7:00 PM) India time. GitHub can start scheduled runs a few minutes late.
   - cron: "30 13 * * 2,4"
  workflow_dispatch: {}  # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Post the next pending poster
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python run_agent.py --from-queue --no-approval

      - name: Save queue and log back to the repo
        if: always()
        run: |
          git config user.name "ig-agent-bot"
          git config user.email "actions@github.com"
          git add posts_queue.json
          if [ -f post_log.json ]; then git add post_log.json; fi
          git diff --cached --quiet || git commit -m "Update queue/log after scheduled post [skip ci]"
          git pull --rebase
          git push
